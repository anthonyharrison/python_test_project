[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-test"
version = "0.1.0"
description = "Sample open-source compliance and SBOM/SAST testing utility"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Anthony Harrison", email = "anthony.p.harrison@gmail.com" }
]
keywords = ["sbom", "compliance", "sast", "security", "supply-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache-2.0 License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "PyYAML==6.0.1",
    "requests==2.31.0",
    "rich==13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "bandit>=1.7.7",
]

[project.scripts]
compliance-test = "compliance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
